# Netlify build settings. Place in the project root, next to package.json.
[build]
  command = "npm run build:prod"
  publish = "dist/weathervane/browser"

[build.environment]
  # Angular 22.2 needs Node ^22.22.3, ^24.15.0 or >=26. "24" resolves to the newest 24.x.
  NODE_VERSION = "24"

# Security headers. geolocation=(self) keeps the "Use my location" button working.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"
