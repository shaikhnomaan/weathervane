<button
  type="button"
  class="btn"
  [disabled]="busy() || permission() === 'denied'"
  [attr.aria-describedby]="permission() === 'denied' ? 'loc-hint' : null"
  (click)="locate.emit()"
>
  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
    <path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z" fill="none" stroke="currentColor" stroke-width="1.8" />
    <circle cx="12" cy="10" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8" />
  </svg>
  {{ busy() ? 'Locating…' : 'Use my location' }}
</button>
@if (permission() === 'denied') {
  <p id="loc-hint" class="hint">Location is blocked for this site. Search for a city, or allow location in your browser settings.</p>
}
