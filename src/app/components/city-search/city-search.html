<div class="search">
  <label class="sr-only" for="city-input">Search for a city</label>
  <input
    id="city-input"
    class="input"
    type="text"
    role="combobox"
    autocomplete="off"
    spellcheck="false"
    placeholder="Search for a city"
    aria-autocomplete="list"
    aria-controls="city-listbox"
    [attr.aria-expanded]="open()"
    [attr.aria-activedescendant]="activeId()"
    [formControl]="query"
    (input)="onInput()"
    (keydown)="onKeydown($event)"
    (blur)="dismissed.set(true)"
  />
  @if (open()) {
    <ul id="city-listbox" class="list" role="listbox" aria-label="City suggestions" (mousedown)="$event.preventDefault()">
      @for (item of state().items; track item.latitude + ',' + item.longitude; let i = $index) {
        <li
          role="option"
          [id]="'city-opt-' + i"
          [attr.aria-selected]="i === active()"
          [class.active]="i === active()"
          (click)="choose(item)"
        >
          <span class="name">{{ item.name }}</span>
          <span class="meta">{{ meta(item) }}</span>
        </li>
      }
    </ul>
  }
  <p class="status" role="status">{{ message() }}</p>
</div>
